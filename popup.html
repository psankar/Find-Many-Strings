<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Find Many Strings</title>
  <style>
  :root {
    --bg: #ffffff;
    --text: #1f1f1f;
    --muted: #5f6368;
    --field-bg: #ffffff;
    --field-border: #9aa0a6;
    --line: #e8eaed;
    --button-bg: #ffffff;
    --button-border: #dadce0;
    --button-hover: #f1f3f4;
    --primary: #1a73e8;
    --primary-hover: #1765cc;
    --error: #c5221f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #202124;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --field-bg: #303134;
      --field-border: #5f6368;
      --line: #3c4043;
      --button-bg: #303134;
      --button-border: #5f6368;
      --button-hover: #3c4043;
      --primary: #8ab4f8;
      --primary-hover: #aecbfa;
      --error: #f28b82;
    }
  }
  body {
    width: 320px;
    margin: 0;
    padding: 14px;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  label {
    display: block;
    margin-bottom: 4px;
    font-size: 12px;
    color: var(--muted);
  }
  input {
    box-sizing: border-box;
    height: 32px;
    padding: 0 8px;
    border: 1px solid var(--field-border);
    border-radius: 6px;
    background: var(--field-bg);
    color: var(--text);
    font: inherit;
  }
  input:focus {
    outline: 2px solid var(--primary);
    outline-offset: -1px;
  }
  #t1 {
    width: 100%;
  }
  .bar {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
  }
  .bar label {
    margin: 0;
  }
  #delim {
    width: 34px;
    height: 28px;
    padding: 0;
    text-align: center;
  }
  .spacer {
    flex: 1;
  }
  button {
    height: 28px;
    padding: 0 12px;
    border: 1px solid var(--button-border);
    border-radius: 6px;
    background: var(--button-bg);
    color: var(--text);
    font: 500 13px system-ui, -apple-system, "Segoe UI", sans-serif;
    cursor: pointer;
  }
  button:hover {
    background: var(--button-hover);
  }
  #search_btn {
    border-color: var(--primary);
    background: var(--primary);
    color: var(--bg);
  }
  #search_btn:hover {
    border-color: var(--primary-hover);
    background: var(--primary-hover);
  }
  #status {
    margin-top: 10px;
    color: var(--error);
  }
  #terms {
    margin-top: 10px;
  }
  .term {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 0;
    border-top: 1px solid var(--line);
  }
  /* A term with no matches: outlined instead of filled, so it never looks like a highlight color */
  .term.zero .chip {
    background: transparent !important;
    border: 1px dashed var(--field-border);
    padding: 1px 7px;
    color: var(--muted);
  }
  button.arrow:disabled {
    color: var(--field-border);
  }
  .chip {
    flex: 1;
    min-width: 0;
    padding: 2px 8px;
    border-radius: 4px;
    color: #1f1f1f;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  button.arrow {
    width: 26px;
    height: 24px;
    padding: 0;
    font-size: 11px;
  }
  button.arrow:disabled {
    cursor: default;
  }
  .count {
    min-width: 52px;
    text-align: right;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  </style>

  <script src="app.js"></script>

</head>
<body>
    <label for="t1">Search for</label>
    <input type="text" id="t1" placeholder="apple, banana, cherry" autofocus>
    <div class="bar">
      <label for="delim">Separator</label>
      <input type="text" id="delim" value=",">
      <span class="spacer"></span>
      <button id="clear_btn" title="Clear all highlights">Clear</button>
      <button id="search_btn">Search</button>
    </div>
    <div id="terms"></div>
    <div id="status" hidden></div>
</body>
</html>
